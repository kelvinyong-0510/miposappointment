<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0a1628" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>MIPOS ShopTech — Self Check-In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0a1628; --navy2:#0f1f38; --navy3:#162340;
    --brand:#ff6500; --brand-d:#e05500;
    --pos:#ff6500; --cs:#0ea5e9; --green:#22c55e; --red:#ef4444;
    --ink:#0a1628; --muted:#64748b; --line:#e2e8f0; --soft:#f4f6f9;
    --font:'Inter',system-ui,-apple-system,sans-serif;
  }
  *,::before,::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:var(--font);color:#fff;
    background:radial-gradient(ellipse 90% 60% at 50% -10%,rgba(255,101,0,.16),transparent),var(--navy);
    user-select:none;-webkit-user-select:none;
  }
  button{font-family:var(--font);cursor:pointer;border:none;background:none;color:inherit}
  .app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* Top bar */
  .top{display:flex;align-items:center;justify-content:space-between;padding:28px 40px 0;flex-shrink:0}
  .logo{height:54px;width:auto;border-radius:8px}
  .langs{display:flex;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);padding:6px;border-radius:999px}
  .lang{padding:10px 20px;border-radius:999px;font-size:1.05rem;font-weight:700;color:rgba(255,255,255,.6);transition:all .15s}
  .lang.on{background:#fff;color:var(--brand)}

  /* Screen system */
  .screen{flex:1;display:none;flex-direction:column;animation:fade .35s ease both;min-height:0}
  .screen.on{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 40px;min-height:0;overflow:auto}
  .wrap::-webkit-scrollbar{display:none}

  /* Home */
  .hello{text-align:center;margin-bottom:44px}
  .hello .eyebrow{display:inline-flex;align-items:center;gap:9px;padding:8px 18px;border-radius:999px;background:rgba(255,101,0,.15);border:1px solid rgba(255,101,0,.3);color:#ff9a5c;font-weight:700;font-size:1rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:22px}
  .hello .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .hello h1{font-size:clamp(2.4rem,5vw,4rem);font-weight:900;letter-spacing:-.02em;line-height:1.08}
  .hello p{margin-top:14px;font-size:clamp(1.1rem,2vw,1.5rem);color:rgba(255,255,255,.6);font-weight:500}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:28px;width:100%;max-width:1000px}
  @media (max-aspect-ratio:1/1){ .choices{grid-template-columns:1fr} }
  .choice{
    background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.03));
    border:1.5px solid rgba(255,255,255,.12);border-radius:28px;padding:48px 36px;text-align:center;
    transition:transform .15s,border-color .15s,background .15s;min-height:300px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  }
  .choice:active{transform:scale(.97)}
  .choice.primary{background:linear-gradient(160deg,var(--brand),var(--brand-d));border-color:transparent;box-shadow:0 20px 50px rgba(255,101,0,.35)}
  .choice .ic{font-size:5rem;line-height:1}
  .choice h2{font-size:clamp(1.8rem,3vw,2.6rem);font-weight:800;letter-spacing:-.02em}
  .choice p{font-size:clamp(1.05rem,1.8vw,1.4rem);color:rgba(255,255,255,.65);font-weight:500}
  .choice.primary p{color:rgba(255,255,255,.85)}

  /* Headings inside flows */
  .h-flow{text-align:center;margin-bottom:24px;flex-shrink:0}
  .h-flow h2{font-size:clamp(1.8rem,3.4vw,2.8rem);font-weight:800;letter-spacing:-.02em}
  .h-flow p{margin-top:8px;font-size:clamp(1rem,1.8vw,1.35rem);color:rgba(255,255,255,.55)}

  /* Phone entry */
  .phone-card{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);border-radius:24px;padding:28px;width:100%;max-width:560px}
  .name-field{width:100%;margin-bottom:18px}
  .name-field label{display:block;font-size:.95rem;font-weight:700;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .name-field input{width:100%;padding:18px 20px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-family:var(--font);font-size:1.5rem;font-weight:600;outline:none}
  .name-field input::placeholder{color:rgba(255,255,255,.3)}
  .phone-display{display:flex;align-items:center;justify-content:center;gap:10px;height:78px;border-radius:16px;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.12);font-size:2.6rem;font-weight:800;letter-spacing:.04em;margin-bottom:18px}
  .phone-display .ph{color:rgba(255,255,255,.28)}
  .phone-display .caret{width:3px;height:2.2rem;background:var(--brand);animation:blink 1.1s step-end infinite}
  @keyframes blink{50%{opacity:0}}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .key{height:84px;border-radius:18px;background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.1);font-size:2.2rem;font-weight:700;color:#fff;transition:transform .08s,background .12s}
  .key:active{transform:scale(.94);background:rgba(255,255,255,.18)}
  .key.fn{font-size:1.5rem;background:rgba(255,255,255,.04)}

  /* Purpose chips */
  .chips{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:760px;margin-bottom:8px}
  .chip{display:inline-flex;align-items:center;gap:10px;padding:18px 26px;border-radius:16px;font-size:1.35rem;font-weight:700;
    background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);color:rgba(255,255,255,.85);transition:all .12s}
  .chip:active{transform:scale(.96)}
  .chip.on{background:rgba(255,101,0,.16);border-color:var(--brand);color:#fff}
  .chip .tick{width:24px;height:24px;border-radius:50%;background:var(--brand);display:none;align-items:center;justify-content:center;font-size:1rem}
  .chip.on .tick{display:inline-flex}

  /* Result cards */
  .result-card{background:#fff;color:var(--ink);border-radius:24px;padding:34px;width:100%;max-width:560px;margin-bottom:18px;text-align:left}
  .result-card .name{font-size:2.2rem;font-weight:900;letter-spacing:-.02em}
  .result-card .meta{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 24px}
  .pillm{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:1.1rem;font-weight:700;background:var(--soft);color:#334155}
  .teamtag{padding:9px 16px;border-radius:999px;font-size:1.05rem;font-weight:800}
  .teamtag.POS{background:rgba(255,101,0,.12);color:#c2410c}
  .teamtag.CS{background:rgba(14,165,233,.12);color:#0369a1}
  .none-card{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);border-radius:24px;padding:40px;text-align:center;max-width:560px}
  .none-card .ic{font-size:4rem;margin-bottom:12px}
  .none-card p{font-size:1.4rem;color:rgba(255,255,255,.7);font-weight:600}

  /* Success */
  .success-ic{width:160px;height:160px;border-radius:50%;background:rgba(34,197,94,.14);display:flex;align-items:center;justify-content:center;font-size:6rem;margin:0 auto 28px;animation:pop .5s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .queue-box{margin-top:26px;display:inline-block;background:linear-gradient(160deg,var(--brand),var(--brand-d));padding:20px 44px;border-radius:22px;box-shadow:0 16px 40px rgba(255,101,0,.35)}
  .queue-box .lbl{font-size:1.05rem;font-weight:700;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.08em}
  .queue-box .num{font-size:3.6rem;font-weight:900;letter-spacing:.02em;line-height:1.05}

  /* Buttons */
  .actions{display:flex;gap:14px;width:100%;max-width:560px;margin-top:6px;flex-shrink:0}
  .btn{flex:1;height:78px;border-radius:18px;font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .1s,opacity .15s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--brand);color:#fff;box-shadow:0 12px 30px rgba(255,101,0,.3)}
  .btn.primary[disabled]{opacity:.4;box-shadow:none}
  .btn.ghost{background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);color:#fff}
  .btn.dark{background:#fff;color:var(--brand)}
  .btn.lg{max-width:420px;margin:0 auto}
  .err{color:#ff8a8a;font-weight:600;font-size:1.15rem;margin-top:14px;min-height:1.4em;text-align:center}

  /* spinner */
  .spin{width:24px;height:24px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  .secret{position:fixed;top:0;left:0;width:90px;height:90px;z-index:50}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <img class="logo" src="/mipos-logo.png" alt="MIPOS" />
    <div class="langs" id="langs"></div>
  </div>

  <!-- HOME -->
  <section class="screen on" id="s-home">
    <div class="wrap">
      <div class="hello">
        <div class="eyebrow"><span class="dot"></span><span data-t="eyebrow"></span></div>
        <h1 data-t="welcome"></h1>
        <p data-t="welcomeSub"></p>
      </div>
      <div class="choices">
        <button class="choice primary" onclick="startFind()">
          <div class="ic">📅</div>
          <h2 data-t="findTitle"></h2>
          <p data-t="findSub"></p>
        </button>
        <button class="choice" onclick="startWalkin()">
          <div class="ic">🚶</div>
          <h2 data-t="walkinTitle"></h2>
          <p data-t="walkinSub"></p>
        </button>
      </div>
    </div>
  </section>

  <!-- PHONE -->
  <section class="screen" id="s-phone">
    <div class="wrap">
      <div class="h-flow">
        <h2 id="phone-title"></h2>
        <p data-t="phoneSub"></p>
      </div>
      <div class="phone-card">
        <div class="name-field" id="name-field" style="display:none">
          <label data-t="nameLabel"></label>
          <input id="name-input" type="text" autocomplete="off" />
        </div>
        <div class="phone-display" id="phone-display"></div>
        <div class="keypad" id="keypad"></div>
      </div>
      <div class="actions">
        <button class="btn ghost" onclick="goHome()" data-t="back"></button>
        <button class="btn primary" id="phone-continue" onclick="phoneContinue()" data-t="continue"></button>
      </div>
      <div class="err" id="phone-err"></div>
    </div>
  </section>

  <!-- FIND RESULT -->
  <section class="screen" id="s-result">
    <div class="wrap" id="result-wrap"></div>
  </section>

  <!-- WALKIN PURPOSE -->
  <section class="screen" id="s-purpose">
    <div class="wrap">
      <div class="h-flow">
        <h2 data-t="purposeTitle"></h2>
        <p data-t="purposeSub"></p>
      </div>
      <div class="chips" id="chips"></div>
      <div class="actions" style="margin-top:30px">
        <button class="btn ghost" onclick="goHome()" data-t="back"></button>
        <button class="btn primary" id="walkin-submit" onclick="submitWalkin()" data-t="checkin"></button>
      </div>
      <div class="err" id="purpose-err"></div>
    </div>
  </section>

  <!-- SUCCESS -->
  <section class="screen" id="s-success">
    <div class="wrap">
      <div class="success-ic">✓</div>
      <div class="h-flow">
        <h2 id="success-title"></h2>
        <p id="success-sub" style="font-size:clamp(1.2rem,2.2vw,1.7rem);color:rgba(255,255,255,.75);max-width:680px;margin:10px auto 0"></p>
      </div>
      <div class="queue-box" id="queue-box">
        <div class="lbl" data-t="queueLabel"></div>
        <div class="num" id="queue-num"></div>
      </div>
      <div style="margin-top:34px"><button class="btn dark lg" style="min-width:280px" onclick="goHome()" data-t="done"></button></div>
    </div>
  </section>
</div>

<!-- hidden 5-tap staff exit corner -->
<div class="secret" id="secret"></div>

<script>
/* ───────── config ───────── */
const API = (location.hostname==='localhost'||location.hostname==='127.0.0.1')
  ? (window.KIOSK_API || 'http://localhost:8788/api')
  : 'https://mipos-api.miporean.workers.dev/api';
const IDLE_MS = 45000;
const SUCCESS_MS = 8000;

/* ───────── i18n ───────── */
const T = {
  en:{ lang:'EN',
    eyebrow:'Self Check-In', welcome:'Welcome to MIPOS ShopTech', welcomeSub:'Please choose an option to begin',
    findTitle:'Find my booking', findSub:'I have an appointment',
    walkinTitle:'Walk-in', walkinSub:'I just arrived',
    phoneFind:'Enter your phone number', phoneWalkin:'Enter your phone number',
    phoneSub:'We’ll use this to find or register you', nameLabel:'Your name (optional)', namePlaceholder:'e.g. Ahmad',
    back:'Back', continue:'Continue', checkin:'Check in', done:'Done',
    purposeTitle:'What do you need help with?', purposeSub:'Tap one or more — or skip',
    queueLabel:'Your queue number',
    noMatch:'No booking found for today', walkinInstead:'Walk-in instead', tryAgain:'Try again',
    foundTitle:'Is this you?', alreadyIn:'Already checked in',
    welcomeName:n=>`Welcome, ${n}!`, pleaseSeat:'Please have a seat — you’re checked in.', allSet:'You’re all set!',
    walkinDone:(n,team)=>`Thanks ${n}! Please have a seat — our ${team} team will serve you shortly.`,
    errPhone:'Please enter a valid phone number', errNet:'Connection problem. Please tell our staff.',
    apptAt:'at', purposeWord:'Purpose', team:'Team',
  },
  my:{ lang:'MY',
    eyebrow:'Daftar Masuk Sendiri', welcome:'Selamat Datang ke MIPOS ShopTech', welcomeSub:'Sila pilih satu pilihan untuk bermula',
    findTitle:'Cari tempahan', findSub:'Saya ada temujanji',
    walkinTitle:'Walk-in', walkinSub:'Saya baru sampai',
    phoneFind:'Masukkan nombor telefon', phoneWalkin:'Masukkan nombor telefon',
    phoneSub:'Kami guna ini untuk cari atau daftar anda', nameLabel:'Nama anda (pilihan)', namePlaceholder:'cth. Ahmad',
    back:'Kembali', continue:'Teruskan', checkin:'Daftar masuk', done:'Selesai',
    purposeTitle:'Apa yang anda perlukan?', purposeSub:'Pilih satu atau lebih — atau langkau',
    queueLabel:'Nombor giliran anda',
    noMatch:'Tiada tempahan untuk hari ini', walkinInstead:'Daftar sebagai walk-in', tryAgain:'Cuba lagi',
    foundTitle:'Ini anda?', alreadyIn:'Sudah daftar masuk',
    welcomeName:n=>`Selamat datang, ${n}!`, pleaseSeat:'Sila duduk — anda telah daftar masuk.', allSet:'Anda sudah selesai!',
    walkinDone:(n,team)=>`Terima kasih ${n}! Sila duduk — pasukan ${team} kami akan melayani anda sebentar lagi.`,
    errPhone:'Sila masukkan nombor telefon yang sah', errNet:'Masalah sambungan. Sila beritahu staf kami.',
    apptAt:'jam', purposeWord:'Tujuan', team:'Pasukan',
  },
  zh:{ lang:'中文',
    eyebrow:'自助签到', welcome:'欢迎来到 MIPOS ShopTech', welcomeSub:'请选择一个选项开始',
    findTitle:'查找我的预约', findSub:'我有预约',
    walkinTitle:'现场登记', walkinSub:'我刚到',
    phoneFind:'请输入电话号码', phoneWalkin:'请输入电话号码',
    phoneSub:'我们用它来查找或登记您', nameLabel:'您的姓名（可选）', namePlaceholder:'例如 陈先生',
    back:'返回', continue:'继续', checkin:'签到', done:'完成',
    purposeTitle:'您需要什么帮助？', purposeSub:'点选一项或多项 — 或跳过',
    queueLabel:'您的排队号码',
    noMatch:'今天没有找到预约', walkinInstead:'改为现场登记', tryAgain:'重试',
    foundTitle:'是您吗？', alreadyIn:'已签到',
    welcomeName:n=>`欢迎，${n}！`, pleaseSeat:'请就座 — 您已签到。', allSet:'完成！',
    walkinDone:(n,team)=>`谢谢 ${n}！请就座 — 我们的 ${team} 团队将很快为您服务。`,
    errPhone:'请输入有效的电话号码', errNet:'连接出现问题。请告知我们的工作人员。',
    apptAt:'', purposeWord:'目的', team:'团队',
  },
};
const PURPOSES = [
  { key:'pos', team:'pos', en:'POS System', my:'Sistem POS', zh:'POS 收银系统' },
  { key:'hardware', team:'cs', en:'Hardware (Sunmi)', my:'Perkakasan (Sunmi)', zh:'硬件设备 (Sunmi)' },
  { key:'support', team:'cs', en:'Technical Support', my:'Sokongan Teknikal', zh:'技术支持' },
  { key:'led', team:'cs', en:'LED Board', my:'Papan LED', zh:'LED 显示板' },
  { key:'pager', team:'cs', en:'Pager System', my:'Sistem Pager', zh:'呼叫器系统' },
  { key:'queue', team:'cs', en:'Queue System', my:'Sistem Giliran', zh:'排队系统' },
  { key:'calling', team:'cs', en:'Calling System', my:'Sistem Panggilan', zh:'叫号系统' },
  { key:'others', team:'cs', en:'Others', my:'Lain-lain', zh:'其他' },
];

/* ───────── state ───────── */
let lang='en', mode='find', phone='', picked=[];
const t = ()=>T[lang];

/* ───────── helpers ───────── */
const $ = s=>document.querySelector(s);
function fmtPhone(d){ if(!d) return ''; if(d.length<=3) return d; return d.slice(0,3)+'-'+d.slice(3); }
function applyLang(){
  document.querySelectorAll('[data-t]').forEach(el=>{ const v=t()[el.getAttribute('data-t')]; if(typeof v==='string') el.textContent=v; });
  $('#name-input').placeholder = t().namePlaceholder;
  document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on', b.dataset.l===lang));
  // re-render dynamic bits
  if($('#s-phone').classList.contains('on')) $('#phone-title').textContent = mode==='find'?t().phoneFind:t().phoneWalkin;
  if($('#s-purpose').classList.contains('on')) renderChips();
}
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on')); $('#'+id).classList.add('on'); }

/* ───────── language switch ───────── */
(function buildLangs(){
  const box=$('#langs');
  ['en','my','zh'].forEach(l=>{
    const b=document.createElement('button'); b.className='lang'; b.dataset.l=l; b.textContent=T[l].lang;
    b.onclick=()=>{ lang=l; applyLang(); };
    box.appendChild(b);
  });
})();

/* ───────── keypad ───────── */
(function buildKeypad(){
  const kp=$('#keypad');
  const keys=['1','2','3','4','5','6','7','8','9','clear','0','del'];
  keys.forEach(k=>{
    const b=document.createElement('button'); b.className='key';
    if(k==='del'){ b.classList.add('fn'); b.textContent='⌫'; b.onclick=()=>{ phone=phone.slice(0,-1); renderPhone(); }; }
    else if(k==='clear'){ b.classList.add('fn'); b.textContent='C'; b.onclick=()=>{ phone=''; renderPhone(); }; }
    else { b.textContent=k; b.onclick=()=>{ if(phone.length<11){ phone+=k; renderPhone(); } }; }
    kp.appendChild(b);
  });
})();
function renderPhone(){
  const d=$('#phone-display');
  if(!phone){ d.innerHTML='<span class="ph">01_ ______</span>'; }
  else { d.innerHTML = fmtPhone(phone)+'<span class="caret"></span>'; }
  $('#phone-continue').disabled = phone.length<8;
  $('#phone-err').textContent='';
}

/* ───────── flows ───────── */
function startFind(){ mode='find'; phone=''; picked=[]; $('#name-field').style.display='none'; $('#phone-title').textContent=t().phoneFind; renderPhone(); show('s-phone'); }
function startWalkin(){ mode='walkin'; phone=''; picked=[]; $('#name-input').value=''; $('#name-field').style.display='block'; $('#phone-title').textContent=t().phoneWalkin; renderPhone(); show('s-phone'); }
function goHome(){ phone=''; picked=[]; $('#name-input').value=''; show('s-home'); }

async function phoneContinue(){
  if(phone.length<8){ $('#phone-err').textContent=t().errPhone; return; }
  if(mode==='walkin'){ renderChips(); show('s-purpose'); return; }
  // find
  const btn=$('#phone-continue'); const old=btn.innerHTML; btn.innerHTML='<div class="spin"></div>'; btn.disabled=true;
  try{
    const r=await fetch(API+'/checkin/lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
    const data=await r.json();
    renderResult(data.appointments||[]);
    show('s-result');
  }catch(e){ $('#phone-err').textContent=t().errNet; }
  finally{ btn.innerHTML=old; btn.disabled=false; }
}

function renderResult(appts){
  const w=$('#result-wrap'); w.innerHTML='';
  const h=document.createElement('div'); h.className='h-flow';
  if(appts.length===0){
    w.innerHTML = `<div class="none-card"><div class="ic">🔍</div><p>${t().noMatch}</p></div>
      <div class="actions" style="margin-top:26px">
        <button class="btn ghost" onclick="startFind()">${t().tryAgain}</button>
        <button class="btn primary" onclick="findToWalkin()">${t().walkinInstead}</button>
      </div>`;
    return;
  }
  h.innerHTML=`<h2>${t().foundTitle}</h2>`; w.appendChild(h);
  appts.forEach(a=>{
    let purposes=''; try{ const ks=JSON.parse(a.purposes||'[]'); purposes=ks.map(k=>{const p=PURPOSES.find(x=>x.key===k);return p?p[lang]:k}).join(', '); }catch(_){ purposes=a.purpose||''; }
    const card=document.createElement('div'); card.className='result-card';
    const done=a.attendance==='attended';
    card.innerHTML=`
      <div class="name">${esc(a.name||'—')}</div>
      <div class="meta">
        ${a.time_slot?`<span class="pillm">🕐 ${esc(a.time_slot)}</span>`:''}
        ${purposes?`<span class="pillm">📌 ${esc(purposes)}</span>`:''}
        <span class="teamtag ${a.needs_pos?'POS':'CS'}">${a.needs_pos?'POS':'CS'} ${t().team}</span>
      </div>
      <button class="btn primary" style="width:100%" ${done?'disabled':''} onclick="doCheckin(${a.id},this)">
        ${done?('✓ '+t().alreadyIn):t().checkin}
      </button>`;
    w.appendChild(card);
  });
  const back=document.createElement('div'); back.className='actions'; back.style.marginTop='8px';
  back.innerHTML=`<button class="btn ghost" onclick="goHome()">${t().back}</button>`;
  w.appendChild(back);
}
function findToWalkin(){ mode='walkin'; picked=[]; $('#name-input').value=''; renderChips(); show('s-purpose'); }

async function doCheckin(id,btn){
  const old=btn.innerHTML; btn.innerHTML='<div class="spin"></div>'; btn.disabled=true;
  try{
    const r=await fetch(API+'/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
    const d=await r.json();
    showSuccess(t().welcomeName(d.name||''), t().pleaseSeat, d.queue_number);
  }catch(e){ btn.innerHTML=old; btn.disabled=false; alert(t().errNet); }
}

/* ───────── walk-in purpose ───────── */
function renderChips(){
  const c=$('#chips'); c.innerHTML='';
  PURPOSES.forEach(p=>{
    const b=document.createElement('button'); b.className='chip'+(picked.includes(p.key)?' on':'');
    b.innerHTML=`<span class="tick">✓</span>${p[lang]}`;
    b.onclick=()=>{ picked.includes(p.key)?picked=picked.filter(k=>k!==p.key):picked.push(p.key); renderChips(); };
    c.appendChild(b);
  });
}
async function submitWalkin(){
  const btn=$('#walkin-submit'); const old=btn.innerHTML; btn.innerHTML='<div class="spin"></div>'; btn.disabled=true;
  const name=$('#name-input').value.trim();
  try{
    const r=await fetch(API+'/checkin/walkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,purposes:picked})});
    const d=await r.json();
    const teamWord = d.team==='POS'?'POS':(lang==='zh'?'客户成功':'Customer Success');
    showSuccess(t().allSet, t().walkinDone(name||(lang==='zh'?'贵宾':'there'), teamWord), d.queue_number);
  }catch(e){ btn.innerHTML=old; btn.disabled=false; $('#purpose-err').textContent=t().errNet; }
}

/* ───────── success ───────── */
let successTimer=null;
function showSuccess(title,sub,queue){
  $('#success-title').textContent=title;
  $('#success-sub').textContent=sub;
  if(queue){ $('#queue-box').style.display='inline-block'; $('#queue-num').textContent=queue; }
  else { $('#queue-box').style.display='none'; }
  show('s-success');
  clearTimeout(successTimer); successTimer=setTimeout(goHome, SUCCESS_MS);
}

/* ───────── idle reset ───────── */
let idleTimer=null;
function resetIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(()=>{ if(!$('#s-home').classList.contains('on')) goHome(); }, IDLE_MS); }
['touchstart','mousedown','keydown'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

/* ───────── staff exit (5 taps top-left) ───────── */
let taps=0,tapT=null;
$('#secret').addEventListener('click',()=>{ taps++; clearTimeout(tapT); tapT=setTimeout(()=>taps=0,1200);
  if(taps>=5){ taps=0; const pin=prompt('Staff PIN'); if(!pin) return;
    if(window.AndroidKiosk && window.AndroidKiosk.exit){ window.AndroidKiosk.exit(pin); }   // native: unlock + exit kiosk
    else if(pin==='1988'){ alert('Staff mode (browser preview). On the Sunmi K2 this exits the locked app.'); } } });

/* helpers */
function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* boot */
applyLang(); renderPhone(); resetIdle();
</script>
</body>
